<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>샘물스튜디오</title>
  <meta name="description" content="샘물스튜디오(Sammul Studio)는 모바일 게임을 만드는 스튜디오예요.">
  <style>
    :root { --bg: #fbfaf7; --fg: #1f2328; --muted: #6a7178; --accent: #2f7d6d; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15181b; --fg: #e8eaed; --muted: #9aa1a8; --accent: #6cc4b0; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      line-height: 1.6; padding: 24px 16px;
    }
    main { max-width: 560px; width: 100%; }
    h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
    .en { color: var(--muted); margin: 0 0 32px; }
    h2 { font-size: 0.85rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 12px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li a { color: var(--accent); font-weight: 600; text-decoration: none; }
    li a:hover { text-decoration: underline; }
    li span { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>샘물스튜디오</h1>
    <p class="en">Sammul Studio · 모바일 게임을 만들어요.</p>
    <h2>Games</h2>
    <ul>
      <li><a href="/honey-bloom/">Honey Bloom</a> <span>— 벌집 보드 퍼즐</span></li>
    </ul>
  </main>
</body>
</html>
